# The suite on three engines, Pint and the dependency audit, on every push to
# main and every PR.
#
# Added 2026-10-08. Until then nothing ran this app's checks but a person on
# their own machine, and a green suite was a sentence in docs/ rather than
# something anyone could look up.
#
# TWO THINGS THIS WORKFLOW NEEDS THAT A CLONE DOES NOT.
#
#   1. The uclemmer/* packages are PRIVATE repositories, pulled through `vcs`
#      entries in composer.json, and the runner's own GITHUB_TOKEN reads only
#      this repo. The COMPOSER_GITHUB_TOKEN secret must hold a token with
#      Contents: read on the laravel-* repos -- the same secret, under the same
#      name, the packages' own CI uses. Without it the first step says so,
#      rather than composer failing inside the resolver.
#
#      The token is the owner's, so CI spends from the owner's GitHub API
#      quota. "Could not authenticate against github.com" is usually that
#      quota running out, not a bad secret (workspace CLAUDE.md).
#
#   2. public/build is gitignored, so the assets are built here. The suite
#      renders pages carrying @vite, and a missing manifest fails every one of
#      them with an error about the manifest rather than about the test.
#
# The suite runs three times: on in-memory SQLite as it does locally
# (phpunit.xml), and on MySQL 8.4 and MariaDB 11 service containers (added
# 2026-10-08; see the test job).

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.5'

jobs:
  # ---------------------------------------------------------------------------
  # The suite, three times: on the in-memory SQLite it runs on locally
  # (phpunit.xml), then on MySQL 8.4 and on MariaDB 11.
  #
  # ⚠ BOTH SERVER ENGINES, UNTIL EVERY APP IS ON MARIADB (owner, 2026-10-08).
  # MariaDB is the target; MySQL stays in the matrix until nothing deploys to
  # it. They are not interchangeable: MariaDB reads ANSI double quotes as
  # strings, MySQL 8 has its own reserved words, and the workspace has lost a
  # production deploy and a month of admin search to SQL that one engine
  # accepted and another refused. Neither row is `continue-on-error`: a job
  # that may fail is a job nobody reads.
  # ---------------------------------------------------------------------------
  test:
    name: Pest · ${{ matrix.database }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        include:
          # A service block cannot be conditional, so the sqlite row starts a
          # MariaDB it never connects to.
          - database: sqlite
            image: mariadb:11
            health: healthcheck.sh --connect --innodb_initialized
          - database: mysql
            image: mysql:8.4
            health: mysqladmin ping -h 127.0.0.1 -uroot -proot --silent
          - database: mariadb
            image: mariadb:11
            health: healthcheck.sh --connect --innodb_initialized

    services:
      db:
        image: ${{ matrix.image }}
        env:
          # The MariaDB image accepts the MYSQL_* names as aliases.
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.health }}"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v7

      - name: Refuse to run without the package token
        env:
          TOKEN: ${{ secrets.COMPOSER_GITHUB_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::The COMPOSER_GITHUB_TOKEN secret is not set. The uclemmer/* packages are private; see the header of this workflow."
            exit 1
          fi

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_sqlite, pdo_mysql
          coverage: none
          tools: composer:v2

      - name: Cache Composer downloads
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: composer install
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.COMPOSER_GITHUB_TOKEN }}"}}'
        run: composer install --no-interaction --no-progress --prefer-dist

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Build the front end
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Prepare .env
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Pest (sqlite)
        if: matrix.database == 'sqlite'
        run: php artisan test --compact

      - name: Pest (${{ matrix.database }})
        if: matrix.database != 'sqlite'
        # ⚠ SHELL ENV BEATS phpunit.xml. PHPUnit does not overwrite a variable
        # that is already set unless its <env> carries force="true", and none
        # here do, so these move the whole suite onto the service. The
        # connection is named for the engine: config/database.php has both.
        env:
          DB_CONNECTION: ${{ matrix.database }}
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: testing
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan test --compact

  lint:
    name: Pint · audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Refuse to run without the package token
        env:
          TOKEN: ${{ secrets.COMPOSER_GITHUB_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::The COMPOSER_GITHUB_TOKEN secret is not set. The uclemmer/* packages are private; see the header of this workflow."
            exit 1
          fi

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          tools: composer:v2

      - name: Cache Composer downloads
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: composer install
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.COMPOSER_GITHUB_TOKEN }}"}}'
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Pint
        run: vendor/bin/pint --test

      - name: composer audit
        run: composer audit --no-interaction
