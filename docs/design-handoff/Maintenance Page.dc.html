<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&amp;family=Caveat:wght@700&amp;family=Source+Sans+3:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#ffffff;color:#22302a;font-family:'Source Sans 3',Georgia,serif;text-wrap:pretty;overflow-x:clip}
a{color:#188042;text-underline-offset:3px}
a:hover{color:#0f5c2e}
</style>
</helmet>
<div style="min-height:100vh;display:grid">
  <main style="position:relative;display:grid;align-content:center;justify-items:center;text-align:center;padding:clamp(48px,8vw,96px) clamp(20px,5vw,64px);overflow:hidden">
    <img src="./assets/cityscape.jpg" alt="Aerial view of Chattanooga's riverfront and bridges" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 40%;filter:saturate(1.15)">
    <div style="position:relative;max-width:760px;display:grid;justify-items:center">
      <img src="./assets/wordmark.jpg" alt="Coast to Coast College Fair" style="width:min(360px,80vw);height:auto;display:block;border-radius:8px;box-shadow:0 6px 28px rgba(8,24,14,0.45)">
      <p style="font-family:Caveat,cursive;font-weight:700;font-size:clamp(28px,3.4vw,40px);color:#b8f0ca;margin:36px 0 0;transform:rotate(-2deg);text-shadow:0 1px 3px rgba(8,24,14,0.9), 0 3px 16px rgba(8,24,14,0.7)">We'll be right back</p>
      <h1 style="font-family:Montserrat,sans-serif;font-weight:800;font-size:clamp(30px,4.2vw,48px);line-height:1.15;text-transform:uppercase;letter-spacing:-0.01em;margin:10px 0 0;color:#ffffff;text-shadow:0 2px 4px rgba(8,24,14,0.85), 0 6px 28px rgba(8,24,14,0.65)">Down for maintenance</h1>
      <p style="font-size:18px;line-height:1.65;max-width:52ch;margin:20px 0 0;color:#ffffff;text-shadow:0 1px 3px rgba(8,24,14,0.9), 0 3px 14px rgba(8,24,14,0.7)">We're making a few improvements to the site. Check back shortly — the fair itself is right on schedule.</p>
      <a href="mailto:contact@coasttocoastcollegefair.com" style="white-space:nowrap;text-decoration:none;background:rgba(255,255,255,0.94);color:#146a37;border:2px solid #ffffff;font-family:Montserrat,sans-serif;font-weight:700;font-size:14px;letter-spacing:0.04em;text-transform:uppercase;padding:13px 26px;border-radius:6px;box-shadow:0 4px 18px rgba(0,0,0,0.35);margin-top:32px" style-hover="background:#ffffff">Email us in the meantime</a>
    </div>
  </main>
</div>
</x-dc>
</body>
</html>
